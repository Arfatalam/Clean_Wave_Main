
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CLEAN WAVE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f2f6fc;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 35px 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            color: #0877d1;
        }

        h2 {
            color: #172b4d;
        }

        p {
            color: #667085;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #0877d1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            color: #176b37;
            background: #e9f8ef;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fef0ef;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #0877d1;
            text-decoration: none;
        }

        @media(max-width:480px) {
            .reset-card {
                padding: 28px 20px;
            }
        }
    </style>

    <script src="password-reset.js" defer></script>
</head>

<body>

    <main class="reset-card">

        <h1>CLEAN WAVE</h1>

        <h2>Create New Password</h2>

        <p>
            Enter and confirm your new password.
            Use at least 8 characters.
        </p>

        <form id="resetPasswordForm">

            <label for="newPassword">New Password</label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="resetSubmitBtn">
                Update Password
            </button>

        </form>

        <div
            id="resetMessage"
            class="message"
            role="status"
            aria-live="polite">
        </div>

        <a class="back-link" href="/login.html">
            Back to Login
        </a>

    </main>

</body>
</html>
